<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your profile | CyberFun</title>
  <link rel="stylesheet" href="../../checkout-flow-v2.css?v=20261124-registration">
  <style>
    body{margin:0;background:#f7f9fb;color:#17212d;font-family:system-ui,sans-serif}
    main{max-width:800px;margin:24px auto;background:white;border:1px solid #c8d4e0}
    fieldset{min-width:0;border:1px solid #c8d4e0;border-radius:6px;margin:16px 0;padding:16px}
    .profile-actions{display:flex;flex-wrap:wrap;gap:12px}
  </style>
</head>
<body>
<main class="cf-checkout">
  <a href="../homepage-wireframes/homepage-unified-booking-v3.html">CyberFun</a>
  <h1>Your profile</h1>
  <form id="profile-form">
    <h2>Account holder</h2>
    <label>First name *<input name="firstName" autocomplete="given-name" required></label>
    <label>Last name *<input name="lastName" autocomplete="family-name" required></label>
    <label>Email *<input name="email" type="email" autocomplete="email" required></label>
    <label>Birthday *<input name="birthday" type="date" required></label>
    <h2>Children</h2>
    <div id="profile-children"></div>
    <button type="button" id="profile-add">Add child</button>
    <p role="status" id="profile-status"></p>
    <div class="profile-actions"><button type="submit">Save &amp; return to membership</button><a id="profile-back">Back to membership</a></div>
  </form>
</main>
<script src="../../profile-members.js?v=20261125"></script>
</body>
</html>
