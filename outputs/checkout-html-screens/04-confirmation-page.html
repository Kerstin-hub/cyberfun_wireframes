<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>04 Confirmation Page</title>
<style>
:root {
  --ink: #17202a;
  --muted: #697684;
  --line: #c9d2dc;
  --soft: #eef2f6;
  --paper: #ffffff;
  --mark: #d9e0e8;
  --accent: #6f7d8b;
  --radius: 8px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #f7f9fb;
  color: var(--ink);
}

a {
  color: inherit;
  text-decoration: none;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  min-height: 68px;
  padding: 0 4vw;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
}

.logo {
  font-weight: 900;
}

.topbar nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
  color: var(--muted);
  font-size: 0.92rem;
}

.intro,
.frame-section {
  width: min(1180px, 92vw);
  margin: 0 auto;
}

.intro {
  padding: 4rem 0 2rem;
}

.intro h1 {
  max-width: 780px;
  margin: 0 0 1rem;
  font-size: clamp(3rem, 8vw, 6rem);
  line-height: 0.92;
}

.intro p:last-child {
  max-width: 680px;
  color: var(--muted);
  font-size: 1.15rem;
  line-height: 1.55;
}

.frame-section {
  padding: 3.5rem 0;
  border-top: 1px solid var(--line);
}

.section-title {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}

.section-title h2 {
  margin: 0;
  font-size: clamp(2rem, 4vw, 3.5rem);
  line-height: 1;
}

.label,
.wire-tag {
  margin: 0;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 900;
  text-transform: uppercase;
}

.browser-frame {
  overflow: hidden;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: 0 20px 50px rgba(23, 32, 42, 0.12);
}

.wire-header {
  display: grid;
  grid-template-columns: 150px 1fr 110px;
  gap: 1rem;
  align-items: center;
  padding: 1rem;
  border-bottom: 1px solid var(--line);
}

.wire-header.compact {
  padding: 0.8rem 1rem;
}

.wire-logo,
.wire-cta,
.wire-actions span,
.booking-options span,
.date-box,
.filter-row span,
.conversion-wire > span {
  display: grid;
  place-items: center;
  min-height: 38px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--soft);
  font-weight: 800;
  font-size: 0.9rem;
}

.wire-nav {
  display: flex;
  gap: 0.45rem;
  justify-content: center;
}

.wire-nav span {
  width: 88px;
  height: 14px;
  border-radius: 999px;
  background: var(--mark);
  color: transparent;
}

.wire-hero,
.sub-hero {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 2rem;
  align-items: center;
  min-height: 420px;
  padding: 2rem;
  background: linear-gradient(135deg, #f4f6f8, #e8edf3);
}

.sub-hero {
  min-height: 330px;
}

.image-box {
  display: grid;
  place-items: center;
  min-height: 280px;
  border: 2px dashed var(--accent);
  border-radius: var(--radius);
  background: #dde5ed;
  color: var(--muted);
  font-weight: 900;
}

.wire-h1 {
  margin: 0.6rem 0 1rem;
  font-size: clamp(3.5rem, 9vw, 8rem);
  font-weight: 950;
  line-height: 0.85;
}

.wire-h1.short {
  font-size: clamp(3rem, 7vw, 5.5rem);
}

.wire-h2 {
  width: min(360px, 100%);
  height: 58px;
  margin: 0.5rem 0 1rem;
  border-radius: var(--radius);
  background: var(--mark);
}

.wire-line {
  height: 14px;
  margin: 0.65rem 0;
  border-radius: 999px;
  background: var(--mark);
}

.wire-line.wide {
  width: min(560px, 100%);
}

.wire-line.medium {
  width: min(380px, 75%);
}

.wire-actions,
.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  margin-top: 1rem;
}

.wire-actions span {
  min-width: 160px;
}

.booking-strip,
.detail-panel-wire,
.conversion-wire {
  display: grid;
  grid-template-columns: 0.7fr 1.5fr 0.7fr;
  gap: 1rem;
  align-items: center;
  margin: 1rem;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.booking-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.5rem;
}

.wire-copy strong,
.conversion-wire strong {
  display: block;
  margin-top: 0.35rem;
  font-size: 1.2rem;
}

.audience-grid,
.card-grid,
.subpage-grid-wire,
.flow-grid,
.sitemap-wire,
.price-row {
  display: grid;
  gap: 1rem;
}

.audience-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 1rem;
}

.audience-grid article,
.card-grid article,
.subpage-grid-wire article,
.flow-grid article,
.sitemap-wire div,
.price-row article,
.detail-columns aside,
.main-detail {
  min-height: 120px;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--soft);
  font-weight: 800;
}

.content-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  align-items: end;
  padding: 1rem;
}

.card-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  padding: 1rem;
}

.card-grid .large-card {
  grid-column: span 2;
  min-height: 220px;
}

.detail-panel-wire {
  grid-template-columns: 1fr 0.9fr;
}

.detail-panel-wire ul {
  display: grid;
  gap: 0.55rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.detail-panel-wire li {
  padding: 0.8rem;
  border-radius: var(--radius);
  background: var(--soft);
}

.subpage-grid-wire {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  padding: 1rem;
}

.conversion-wire {
  grid-template-columns: 1fr 180px;
}

.detail-columns {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 1rem;
  padding: 1rem;
}

.detail-columns aside {
  display: grid;
  gap: 0.6rem;
  align-content: start;
}

.detail-columns aside span {
  height: 12px;
  border-radius: 999px;
  background: var(--mark);
  color: transparent;
}

.main-detail {
  min-height: 260px;
}

.price-row {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  margin-bottom: 2rem;
}

.flow-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.flow-grid article {
  min-height: 190px;
}

.flow-grid span {
  display: grid;
  place-items: center;
  width: 36px;
  aspect-ratio: 1;
  border-radius: 999px;
  background: var(--ink);
  color: white;
  font-weight: 900;
}

.flow-grid p {
  color: var(--muted);
  line-height: 1.5;
}

.checkout-note {
  margin-bottom: 1rem;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--muted);
  line-height: 1.5;
}

.checkout-note strong {
  color: var(--ink);
}

.checkout-overview,
.checkout-flow,
.package-grid,
.quantity-list,
.addon-grid {
  display: grid;
  gap: 1rem;
}

.checkout-overview {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 1rem;
}

.checkout-overview.compact-overview {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.checkout-overview article {
  min-height: 150px;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.checkout-overview span {
  display: grid;
  place-items: center;
  width: 34px;
  aspect-ratio: 1;
  margin-bottom: 0.8rem;
  border-radius: 999px;
  background: var(--ink);
  color: white;
  font-weight: 900;
}

.checkout-overview p {
  color: var(--muted);
  line-height: 1.45;
}

.checkout-screen {
  overflow: hidden;
  border: 2px solid var(--ink);
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: 0 20px 50px rgba(23, 32, 42, 0.1);
}

.screen-top {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem;
  border-bottom: 1px solid var(--line);
  background: var(--soft);
}

.screen-top span,
.mini-label {
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 900;
  text-transform: uppercase;
}

.event-header {
  display: grid;
  grid-template-columns: 150px 110px 120px 1fr 70px 50px;
  gap: 1rem;
  align-items: center;
  padding: 1rem;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}

.event-header strong {
  font-size: 1.9rem;
  line-height: 1;
}

.event-header span,
.event-header div {
  display: grid;
  align-items: center;
  min-height: 40px;
  color: var(--ink);
  font-weight: 800;
}

.event-header div {
  padding: 0 1rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
}

.party-detail-layout {
  display: grid;
  grid-template-columns: minmax(500px, 0.95fr) minmax(620px, 0.85fr);
  gap: 2rem;
  align-items: start;
  max-width: 1440px;
  margin: 0 auto;
  padding: 1.4rem 2rem;
  background: #fff;
}

.party-copy {
  display: grid;
  gap: 1rem;
  align-content: start;
  min-width: 0;
}

.party-hero-image {
  display: grid;
  place-items: center;
  min-height: 360px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #dce8f3;
  color: var(--muted);
  font-weight: 900;
}

.rating-line {
  color: var(--muted);
  font-weight: 900;
}

.google-rating {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  color: #d97706;
}

.google-rating span {
  display: inline-grid;
  place-items: center;
  min-height: 28px;
  padding: 0 0.65rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  font-weight: 900;
}

.party-copy h3 {
  max-width: 760px;
  margin: 0;
  font-size: clamp(2rem, 5vw, 3.6rem);
  line-height: 1.05;
}

.party-copy h4 {
  margin: 0.6rem 0 0;
  font-size: 1.15rem;
}

.party-copy p,
.party-copy li {
  color: var(--ink);
  font-size: 1rem;
  line-height: 1.55;
}

.party-copy ul {
  display: grid;
  gap: 0.35rem;
  margin: 0;
  padding-left: 1.1rem;
}

.progress-wire {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.5rem;
  padding: 1rem;
}

.progress-wire.two-step {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.progress-wire span {
  min-height: 34px;
  padding: 0.45rem;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--soft);
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 800;
  text-align: center;
}

.progress-wire .active {
  border-color: var(--ink);
  background: var(--ink);
  color: white;
}

.progress-wire .done {
  border-color: var(--accent);
  background: #e1e8ef;
  color: var(--ink);
}

.checkout-layout,
.date-time-layout,
.registration-layout,
.payment-layout {
  display: grid;
  gap: 1rem;
  padding: 1rem;
}

.checkout-layout {
  grid-template-columns: 1fr 280px;
}

.date-time-layout {
  grid-template-columns: 0.9fr 1fr 250px;
}

.payment-layout {
  grid-template-columns: 1fr 340px;
}

.payment-detail-layout {
  display: grid;
  grid-template-columns: minmax(500px, 0.95fr) minmax(620px, 0.85fr);
  gap: 2rem;
  align-items: start;
  max-width: 1440px;
  margin: 0 auto;
  padding: 1.4rem 2rem;
  background: #fff;
}

.payment-copy {
  display: grid;
  align-content: start;
  gap: 1rem;
}

.payment-copy h3 {
  max-width: 760px;
  margin: 0;
  font-size: clamp(2rem, 5vw, 3.6rem);
  line-height: 1.05;
}

.payment-copy p {
  max-width: 760px;
  margin: 0;
  color: var(--muted);
  line-height: 1.55;
}

.payment-checkout {
  display: grid;
  gap: 1rem;
  width: min(100%, 680px);
  justify-self: start;
}

.payment-recap-card,
.payment-trust-list {
  display: grid;
  gap: 0.7rem;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--soft);
}

.payment-recap-card span {
  color: var(--muted);
  font-weight: 800;
}

.payment-trust-list {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  background: var(--paper);
}

.payment-trust-list span {
  display: grid;
  place-items: center;
  min-height: 54px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink);
  font-weight: 900;
  text-align: center;
}

.registration-layout {
  grid-template-columns: minmax(0, 1fr);
  justify-content: center;
}

.registration-layout .account-panel {
  width: min(100%, 820px);
  justify-self: center;
}

.single-page-booking {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 1rem;
  padding: 1rem;
  align-items: start;
}

.party-detail-layout .single-page-booking {
  grid-template-columns: minmax(0, 1fr);
  width: min(100%, 680px);
  padding: 0;
  justify-self: start;
}

.party-detail-layout .booking-page-main {
  gap: 0.75rem;
}

.party-detail-layout .booking-block {
  padding: 0.85rem;
}

.party-detail-layout .sticky-summary {
  grid-column: auto;
  position: static;
  min-height: auto;
}

.booking-page-main {
  display: grid;
  gap: 1rem;
}

.booking-block {
  display: grid;
  gap: 0.8rem;
  padding: 0.9rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--soft);
}

.booking-block-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
}

.booking-block-title strong {
  font-size: 1.15rem;
}

.inline-date-time,
.date-time-stack {
  display: grid;
  gap: 1rem;
}

.inline-date-time {
  grid-template-columns: minmax(260px, 0.85fr) minmax(260px, 1fr);
}

.one-page-screen .package-grid article {
  min-height: 150px;
}

.package-grid.package-grid-compact {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.package-grid.package-grid-compact article {
  min-height: 142px;
  gap: 0.45rem;
}

.package-grid.package-grid-compact h3 {
  font-size: 1rem;
}

.package-grid.package-grid-compact button {
  min-height: 36px;
}

.sticky-summary {
  position: sticky;
  top: 88px;
}

.checkout-main,
.calendar-wire,
.session-list,
.account-panel,
.payment-panel,
.order-summary,
.receipt-panel {
  min-height: 220px;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--soft);
}

.payment-panel {
  display: grid;
  align-content: start;
  gap: 1rem;
}

.large-payment-options {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin-bottom: 0;
}

.pay-confirm-wire {
  display: grid;
  gap: 0.4rem;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.pay-confirm-wire span {
  color: var(--muted);
}

.payment-method-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.65rem;
}

.payment-method-row span {
  display: grid;
  place-items: center;
  min-height: 52px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  font-weight: 900;
}

.payment-method-row .selected {
  border: 2px solid var(--ink);
  background: #e8edf3;
}

.card-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem 1rem;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.card-fields > label,
.card-fields > span {
  grid-column: 1 / -1;
}

.card-fields label {
  color: var(--muted);
  font-size: 0.86rem;
  font-weight: 900;
}

.card-fields span {
  display: grid;
  align-items: center;
  min-height: 44px;
  padding: 0 0.8rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  color: var(--muted);
  font-weight: 800;
}

.card-fields div {
  display: grid;
  gap: 0.35rem;
}

.confirmation-layout {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 1rem;
  padding: 1rem;
}

.confirmation-panel,
.qr-panel {
  display: grid;
  align-content: center;
  gap: 1rem;
  min-height: 320px;
  padding: 1.4rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--soft);
}

.confirmation-panel h3 {
  max-width: 620px;
  margin: 0;
  font-size: clamp(1.8rem, 4vw, 3rem);
  line-height: 1.05;
}

.confirmation-panel p {
  margin: 0;
  color: var(--muted);
  font-size: 1.1rem;
}

.booking-number {
  display: grid;
  gap: 0.25rem;
  width: fit-content;
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.booking-number span {
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 900;
  text-transform: uppercase;
}

.qr-panel {
  justify-items: center;
  text-align: center;
}

.qr-code {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: 180px;
  aspect-ratio: 1;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.qr-code span {
  background: var(--ink);
}

.qr-code span:nth-child(2n),
.qr-code span:nth-child(5),
.qr-code span:nth-child(11) {
  background: var(--mark);
}

.product-tabs,
.duration-toggle,
.checkout-choice,
.payment-options {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.booking-block .duration-toggle {
  margin-bottom: 0;
}

.product-tabs span,
.duration-toggle span,
.checkout-choice span,
.payment-options span {
  display: grid;
  place-items: center;
  min-height: 38px;
  padding: 0 0.85rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  font-weight: 800;
}

.product-tabs .active,
.duration-toggle .active,
.checkout-choice .active {
  border-color: var(--ink);
  background: var(--ink);
  color: white;
}

.package-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.package-grid article,
.quantity-list article,
.addon-grid article {
  padding: 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
}

.package-grid article {
  display: grid;
  align-content: start;
  gap: 0.7rem;
  min-height: 260px;
}

.package-grid .featured,
.addon-grid .selected {
  border: 2px solid var(--ink);
}

.package-grid h3,
.package-grid p,
.quantity-list p,
.addon-grid p {
  margin: 0;
}

.package-grid p,
.quantity-list p,
.addon-grid p {
  color: var(--muted);
  line-height: 1.45;
}

button {
  min-height: 42px;
  border: 0;
  border-radius: var(--radius);
  background: var(--ink);
  color: white;
  font: inherit;
  font-weight: 900;
}

.order-summary,
.receipt-panel {
  display: grid;
  align-content: start;
  gap: 0.75rem;
